name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key so updates install over older builds.
      # Add repo secrets BT_KEYSTORE_BASE64, BT_KEYSTORE_PASSWORD, BT_KEY_ALIAS, BT_KEY_PASSWORD.
      - name: Set up release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.BT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
          BT_KEY_ALIAS: ${{ secrets.BT_KEY_ALIAS }}
          BT_KEY_PASSWORD: ${{ secrets.BT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: BetterTorrent-apk
          path: app/build/outputs/apk/release/*.apk
